<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZUR — Games Portal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;600;700&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(90deg, #e832d5 0%, #f5687a 52%, #ffb300 100%);
    font-family: 'Caveat', cursive, sans-serif;
    color: #ffffff;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Top Navbar */
  header {
    width: 100%;
    height: 92px;
    background-color: #202020;
    display: flex;
    align-items: center;
    padding: 0 36px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    position: relative;
    z-index: 20;
  }

  .logo-btn {
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }

  .logo-btn:hover {
    transform: scale(1.06);
  }

  nav {
    flex: 1;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding-left: 20px;
  }

  .nav-item {
    background: none;
    border: none;
    font-family: 'Caveat', cursive, sans-serif;
    font-size: 40px;
    font-weight: 600;
    color: #e59a3c;
    cursor: pointer;
    position: relative;
    padding: 4px 14px;
    transition: color 0.25s ease, transform 0.2s ease;
  }

  .nav-item:hover {
    color: #ffc266;
    transform: translateY(-2px);
  }

  .nav-item.active {
    color: #ffd07b;
  }

  .nav-item.active::after {
    content: '';
    position: absolute;
    left: 12%;
    right: 12%;
    bottom: -4px;
    height: 4px;
    border-radius: 4px;
    background: #ffd07b;
    box-shadow: 0 0 10px rgba(255, 208, 123, 0.8);
  }

  /* Main Views */
  main {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .view {
    display: none;
    flex: 1;
    width: 100%;
    padding: 48px 56px;
  }

  .view.active {
    display: flex;
  }

  /* Home View */
  #view-home {
    align-items: center;
    justify-content: center;
  }

  .hero-text {
    font-size: 56px;
    font-weight: 600;
    color: #ffffff;
    text-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
    opacity: 0;
    transform: translateY(14px);
    animation: fadeInUp 1.1s ease forwards;
  }

  @keyframes fadeInUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Games View */
  #view-games {
    align-items: flex-start;
    justify-content: flex-start;
  }

  .games-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 36px;
    align-items: flex-start;
  }

  .game-card {
    width: 196px;
    height: 196px;
    border-radius: 38px;
    border: none;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    opacity: 0;
    transform: translateY(18px) scale(0.96);
    animation: cardAppear 0.65s ease forwards;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .game-card:nth-child(1) { animation-delay: 0.05s; }
  .game-card:nth-child(2) { animation-delay: 0.14s; }
  .game-card:nth-child(3) { animation-delay: 0.23s; }
  .game-card:nth-child(4) { animation-delay: 0.32s; }

  @keyframes cardAppear {
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .game-card:hover {
    transform: translateY(-6px) scale(1.04);
    box-shadow: 0 16px 34px rgba(0, 0, 0, 0.38);
  }

  .game-card:active {
    transform: scale(0.98);
  }

  .card-gta {
    background: radial-gradient(circle at 30% 25%, #168f1e 0%, #095c10 100%);
    padding: 20px;
  }

  .card-gta img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.45));
  }

  .card-full img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* News & About Views */
  #view-news, #view-about {
    align-items: center;
    justify-content: center;
  }

  .info-box {
    background: rgba(32, 32, 32, 0.86);
    backdrop-filter: blur(8px);
    border: 2px solid rgba(255, 208, 123, 0.35);
    border-radius: 28px;
    padding: 36px 52px;
    text-align: center;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.32);
    opacity: 0;
    transform: translateY(14px);
    animation: fadeInUp 0.65s ease forwards;
  }

  .news-date {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #e59a3c;
    margin-bottom: 10px;
  }

  .info-text {
    font-size: 48px;
    color: #ffffff;
  }

  /* Server Picker Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(6px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal-card {
    background: #1f1f1f;
    border: 2px solid #383838;
    border-radius: 24px;
    padding: 28px 32px;
    max-width: 460px;
    width: 100%;
    font-family: 'Inter', sans-serif;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    animation: fadeInUp 0.25s ease forwards;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .modal-title {
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
  }

  .modal-close {
    background: #2f2f2f;
    border: none;
    color: #cccccc;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  .modal-close:hover {
    background: #e53935;
    color: #ffffff;
  }

  .modal-sub {
    font-size: 13px;
    color: #aaaaaa;
    margin-bottom: 18px;
    line-height: 1.45;
  }

  .server-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .server-link-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #2a2a2a;
    border: 1px solid #3d3d3d;
    border-radius: 14px;
    padding: 14px 16px;
    color: #ffffff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
  }

  .server-link-btn:hover {
    background: #1b8a28;
    border-color: #2ecc40;
    transform: translateX(3px);
  }

  .server-badge {
    font-size: 12px;
    background: rgba(255,255,255,0.12);
    padding: 4px 9px;
    border-radius: 8px;
    color: #e0e0e0;
    white-space: nowrap;
    margin-left: 8px;
  }

  /* Embedded Player Overlay (Minecraft) */
  .player-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #111111;
    z-index: 120;
    flex-direction: column;
    font-family: 'Inter', sans-serif;
  }

  .player-overlay.open {
    display: flex;
  }

  .player-bar {
    height: 54px;
    background: #1d1d1d;
    border-bottom: 1px solid #333333;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    gap: 12px;
  }

  .player-status {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 600;
    color: #f0f0f0;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #2ecc40;
    box-shadow: 0 0 8px #2ecc40;
  }

  .player-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .ctrl-btn {
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: #ffffff;
    transition: opacity 0.2s, transform 0.15s;
  }

  .ctrl-btn:hover {
    opacity: 0.9;
    transform: translateY(-1px);
  }

  .btn-fullscreen {
    background: #1976d2;
  }

  .btn-switch {
    background: #383838;
  }

  .btn-close-player {
    background: #d32f2f;
  }

  #game-iframe {
    flex: 1;
    width: 100%;
    border: none;
    background: #000000;
  }
</style>
</head>

        <polygon points="28,46 72,46 50,68" fill="#ffffff"/>

  const externalGames = {
    gtav: {
      title: 'Grand Theft Auto V — Выбери сервер',
      servers: [
        { name: 'Сервер 1 — playgta5.com', url: 'https://playgta5.com/', tag: 'Основной' },

  const mcServers = [
    { label: 'Minecraft — Сервер 1 (eaglercraft.com)', url: 'https://eaglercraft.com/mc/1.8.8/' },
    { label: 'Minecraft — Сервер 2 (eaglercraftx.pages.dev)', url: 'https://eaglercraftx.pages.dev/' },
    { label: 'Minecraft — Сервер 3 (classic.minecraft.net)', url: 'https://classic.minecraft.net/' }

  let currentMcIndex = 0;

  function switchTab(tabName) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

    const targetView = document.getElementById('view-' + tabName);
    if (targetView) {
      targetView.classList.add('active');
      targetView.querySelectorAll('.hero-text, .game-card, .info-box').forEach(el => {
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = '';
      });
    }

    const activeBtn = document.getElementById('tab-' + tabName);
    if (activeBtn) {
      activeBtn.classList.add('active');
    }
  }

  function openServerModal(gameKey) {
    const game = externalGames[gameKey];
    if (!game) return;
    document.getElementById('modal-game-title').textContent = game.title;
    const list = document.getElementById('modal-server-list');
    list.innerHTML = '';

    game.servers.forEach(srv => {
      const a = document.createElement('a');
      a.className = 'server-link-btn';
      a.href = srv.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = `<span>${srv.name}</span><span class="server-badge">${srv.tag} ↗</span>`;
      a.onclick = () => setTimeout(closeServerModal, 150);
      list.appendChild(a);
    });

    document.getElementById('server-modal').classList.add('open');
  }

  function closeServerModal() {
    document.getElementById('server-modal').classList.remove('open');
  }

  function openMinecraftPlayer() {
    currentMcIndex = 0;
    loadMcServer();
    document.getElementById('mc-player').classList.add('open');
  }

  function loadMcServer() {
    const srv = mcServers[currentMcIndex];
    document.getElementById('mc-server-label').textContent = srv.label;
    document.getElementById('game-iframe').src = srv.url;
  }

  function nextMcServer() {
    currentMcIndex = (currentMcIndex + 1) % mcServers.length;
    loadMcServer();
  }

  function closeMinecraftPlayer() {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    }
    document.getElementById('game-iframe').src = 'about:blank';
    document.getElementById('mc-player').classList.remove('open');
  }

  function toggleFullscreen() {
    const player = document.getElementById('mc-player');
    if (!document.fullscreenElement) {
      player.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeServerModal();
      if (document.getElementById('mc-player').classList.contains('open') && !document.fullscreenElement) {
        closeMinecraftPlayer();
      }
    }
  });
</script>
</body>
</html>
